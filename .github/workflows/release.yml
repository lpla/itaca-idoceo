name: Release to PyPI

on:
  release:
    types: [published]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-release]'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Build distributions
        run: |
          python -m pip install build
          python -m build
      - name: Create GitHub release for connector-triggered publication
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          TAG="v${VERSION}"
          NOTES="docs/RELEASE_${VERSION}.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; continuing."
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "ITACA → iDoceo ${VERSION}" --notes-file "$NOTES" --latest
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-release]'))
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/itaca-idoceo
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
