name: Error de extracción
about: Informar de un problema sin compartir datos personales del alumnado
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por ayudar a probar ITACA → iDoceo.

        **No adjuntes PDF, XLSX, capturas, nombres, NIA, REPETIX, MATÈRIA/MÒDUL ni información identificativa del centro, grupo o tutor.**

        En la aplicación usa **Ayuda → Copiar diagnóstico anonimizado**, revisa el texto y pega únicamente ese diagnóstico junto con una descripción no identificativa del problema.
  - type: input
    id: version
    attributes:
      label: Versión de ITACA → iDoceo
      description: Puedes consultarla ejecutando `itaca-idoceo --version`.
      placeholder: "Pega aquí la versión instalada"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Sistema operativo
      options:
        - Windows
        - macOS
        - LliureX
        - Otro Linux
    validations:
      required: true
  - type: textarea
    id: diagnostic
    attributes:
      label: Diagnóstico anonimizado
      description: Pega el contenido generado por Ayuda → Copiar diagnóstico anonimizado. Revísalo antes de enviarlo.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Qué esperabas que ocurriera
      description: Describe únicamente estructura o recuentos no identificativos, por ejemplo «deberían detectarse 30 alumnos».
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Qué ocurrió
      description: No pegues nombres, NIA, REPETIX, MATÈRIA/MÒDUL, grupo, tutor, centro, rutas locales ni contenido sensible del PDF.
    validations:
      required: true
